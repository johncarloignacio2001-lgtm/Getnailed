{% extends 'base.html' %}
{% block title %}Export Forecast | {{ BRAND_NAME }}{% endblock %}
{% block content %}<div class="content-card service-form-card"><div class="eyebrow">FORECAST EXPORT</div><h2>Export generated results</h2><p>Run {{ run.public_id }} currently contains {{ run.results.count }} forecast values.</p><a class="btn btn-brand" href="{% url 'forecasting:export_csv' public_id=run.public_id %}">Download CSV</a> <a class="btn btn-link" href="{% url 'forecasting:detail' public_id=run.public_id %}">Back to run</a></div>{% endblock %}
