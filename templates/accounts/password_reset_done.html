{% extends 'base.html' %}
{% block title %}Reset Requested | {{ BRAND_NAME }}{% endblock %}
{% block public_content %}
<div class="login-page min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="login-card text-center">
    <h1 class="h3">Check your email</h1>
    <p class="text-muted">If an eligible account exists for that email address, password-reset instructions have been sent.</p>
    <a href="{% url 'accounts:login' %}">Return to sign in</a>
  </div>
</div>
{% endblock %}
