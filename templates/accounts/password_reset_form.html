{% extends 'base.html' %}
{% block title %}Reset Password | {{ BRAND_NAME }}{% endblock %}
{% block public_content %}
<div class="login-page min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="login-card">
    <h1 class="h3">Reset your password</h1>
    <p class="text-muted">Enter your email address. We will send instructions if the account is eligible.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3"><label class="form-label" for="{{ form.email.id_for_label }}">Email address</label>{{ form.email }}</div>
      <button class="btn btn-brand w-100" type="submit">Send reset instructions</button>
    </form>
    <div class="text-center mt-3"><a href="{% url 'accounts:login' %}">Return to sign in</a></div>
  </div>
</div>
{% endblock %}
