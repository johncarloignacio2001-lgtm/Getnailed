{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-4" aria-label="Results pages">
  <ul class="pagination justify-content-center flex-wrap">
    {% if page_obj.has_previous %}
      <li class="page-item"><a class="page-link" href="?q={{ q|default:''|urlencode }}&category={{ category|default:''|urlencode }}&availability={{ availability|default:''|urlencode }}&status={{ status|default:''|urlencode }}&page={{ page_obj.previous_page_number }}">Previous</a></li>
    {% endif %}
    <li class="page-item disabled"><span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
      <li class="page-item"><a class="page-link" href="?q={{ q|default:''|urlencode }}&category={{ category|default:''|urlencode }}&availability={{ availability|default:''|urlencode }}&status={{ status|default:''|urlencode }}&page={{ page_obj.next_page_number }}">Next</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
