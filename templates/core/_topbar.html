{% load static %}
<nav class="navbar navbar-expand-lg landing-topbar sticky-top">
  <div class="container-fluid px-lg-5 px-3">
    <!-- Brand / Logo -->
    <a class="navbar-brand landing-brand d-flex align-items-center py-0" href="{% url 'core:home' %}">
      <img src="{% static 'images/get-nailed-logo.png' %}" alt="Get Nailed logo" class="landing-brand-logo">
      <div class="landing-brand-text ms-2">
        <span class="landing-brand-name">Get Nailed</span>
        <small class="landing-brand-sub">Nail Bar And Spa</small>
      </div>
    </a>

    <!-- Mobile Toggler -->
    <button class="navbar-toggler landing-toggler border-0 shadow-none p-1" type="button" data-bs-toggle="collapse" data-bs-target="#landingNavbarNav" aria-controls="landingNavbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Nav Links & Auth Buttons -->
    <div class="collapse navbar-collapse" id="landingNavbarNav">
      <ul class="navbar-nav landing-nav-links ms-auto align-items-lg-center gap-lg-3 my-2 my-lg-0">
        <li class="nav-item">
          <a class="nav-link landing-nav-link" href="{% url 'core:home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link landing-nav-link" href="#services">Services</a>
        </li>
        <li class="nav-item">
          <a class="nav-link landing-nav-link" href="#visit-us">Contact Us</a>
        </li>
        <li class="nav-item">
          {% if user.is_authenticated %}
            <a class="nav-link landing-nav-link" href="{% url 'bookings:index' %}">Book Now</a>
          {% else %}
            <a class="nav-link landing-nav-link" href="{% url 'customers:customer_login' %}">Book Now</a>
          {% endif %}
        </li>

        <!-- Auth Action Buttons -->
        {% if user.is_authenticated %}
          <li class="nav-item ms-lg-2">
            <a href="{% url 'core:dashboard_router' %}" class="landing-pill-btn">Dashboard</a>
          </li>
        {% else %}
          <li class="nav-item ms-lg-2">
            <a href="{% url 'customers:customer_login' %}" class="landing-pill-btn">LOGIN</a>
          </li>
          <li class="nav-item ms-lg-1">
            <a href="{% url 'customers:register_customer' %}" class="landing-pill-btn">SIGN UP</a>
          </li>
        {% endif %}
