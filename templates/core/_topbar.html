{% load static %}
<header class="site-header">
  <div class="container">
    <nav class="navbar navbar-expand-lg navbar-light px-0 py-2">
      <a class="navbar-brand d-flex align-items-center gap-3" href="{% url 'core:home' %}">
        <img class="brand-logo" src="{% static 'images/get-nailed-logo.png' %}" alt="Get Nailed logo">
        <div>
          <span class="brand-title d-block">GET NAILED</span>
          <span class="brand-subtitle d-block">Nail Bar &amp; Spa</span>
        </div>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
          <li class="nav-item"><a class="nav-link fs-6 fw-semibold" href="{% url 'core:home' %}#gallery">Gallery</a></li>
          <li class="nav-item"><a class="nav-link fs-6 fw-semibold" href="{% url 'bookings:index' %}">Services &amp; Pricing</a></li>
          <li class="nav-item"><a class="nav-link fs-6 fw-semibold" href="{% url 'core:home' %}#branches">Branches</a></li>

          {% if request.user.is_authenticated %}
            <li class="nav-item"><a class="nav-link fs-6 fw-semibold" href="{% url 'bookings:index' %}">Book Now</a></li>
            <li class="nav-item"><a class="nav-link fs-6 fw-semibold" href="{% url 'core:dashboard_router' %}">My Portal</a></li>
            <li class="nav-item"><a class="nav-link fs-6 fw-semibold" href="{% url 'notifications:messages' %}">Messages</a></li>
            <li class="nav-item">
              <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">
                {% csrf_token %}
                <button class="btn btn-link nav-link p-0 fs-6 fw-semibold" type="submit">Sign out</button>
              </form>
            </li>
          {% else %}
            <li class="nav-item"><a class="nav-link fs-6 fw-semibold" href="{% url 'accounts:login' %}?next={% url 'bookings:index' %}">Book Now</a></li>
            <li class="nav-item"><a class="btn btn-dark px-4 py-2 fs-6 fw-bold" href="{% url 'accounts:login' %}">Sign In</a></li>
          {% endif %}
        </ul>
      </div>
    </nav>
  </div>
</header>
