<div class="login-page min-vh-100 d-flex align-items-center justify-content-center p-3"><div class="login-card">
  <div class="eyebrow">BOOKING VERIFICATION</div><h1 class="h3">Request another code</h1>
  <p class="text-muted">If the reference and email belong to an eligible unverified booking, a new code will be sent.</p>
  <form method="post" novalidate>{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-brand w-100" type="submit">Request code</button></form>
</div></div>
