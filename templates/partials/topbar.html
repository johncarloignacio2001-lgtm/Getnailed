<header class="topbar">
  <div>
    <h1 class="h5 mb-0">Welcome, {{ user.first_name|default:user.email }}</h1>
    <small class="text-muted">{{ user.get_role_display }}</small>
  </div>
  <div class="d-flex flex-wrap gap-2">
    <a class="btn btn-outline-dark btn-sm" href="{% url 'accounts:password_change' %}">Change password</a>
    <a class="btn btn-outline-dark btn-sm d-none d-sm-inline-block" href="{% url 'accounts:logout_all_devices' %}">Log out all devices</a>
    <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">
      {% csrf_token %}
      <button class="btn btn-outline-dark btn-sm" type="submit">Log out</button>
    </form>
  </div>
</header>
